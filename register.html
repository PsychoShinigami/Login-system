<!DOCTYPE html>
<html>
    <head>
        <title>Mortal Realm | Registration</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <h1 class="title1">Mortal Realm</h1>
            <h1 class="title2">Registration</h1>
            <div class="login-container">
                <div class="username">
                    <h2 class="username-text">Mortal Name</h2>
                    <input type="text" placeholder="Choose Mortal Name...">
                </div>
                <div class="username">
                    <h2 class="username-text">Soul ID (Email)</h2>
                    <input type="email" placeholder="Enter Soul ID...">
                </div>
                <div class="password">
                    <h2 class="password-text">Death Key</h2>
                    <input type="password" placeholder="Create Death Key...">
                </div>
                <div class="password">
                    <h2 class="password-text">Confirm Key</h2>
                    <input type="password" placeholder="Repeat Death Key...">
                </div>
                <div class="submit-button" style="grid-column: span 2; margin-right: 0;">
                    <button class="submit-btn" id="submit-btn">Register</button>
                    <h3 class="submit-text">
                        Already bound? <a href="index.html" style="color: #00aaff; text-decoration: none;">Login here</a>
                    </h3>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
