<html>
    <head>
        <title>Login System</title>
    </head>
    <body>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
        <div class="container">
            <h1 class="title1">mortal Realm</h1>
            <h1 class="title2">verification</h1>
            <div class="login-container">
                <div class="username">
                    <h2 class="username-text">Mortal Name</h2>
                    <input type="text" placeholder="Enter Mortal Name...">
                </div>
                <div class="password">
                    <h2 class="password-text">Death Key</h2>
                    <input type="password" placeholder="Enter Password...">
                </div>
                <div class="submit-button" style="grid-column: span 2; margin-right: 0;">
                    <button id="submit-btn" class="submit-btn">Submit</button>
                    <h3 class="submit-text" id="submit-text">New to This Realm?<a href="register.html" class="signup-link" style="color: #00aaff; text-decoration: none;">Sign Up!</a></h3>
                </div>
                
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
