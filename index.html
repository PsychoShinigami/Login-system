<html>
    <head>
        <title>Login System</title>
    </head>
    <body>
        <link rel="stylesheet" href="style.css">
        <div class="container">
            <h1 class="title1">mortal Realm</h1>
            <h1 class="title2">verification</h1>
            <div class="login-container">
                <div class="username">
                    <h2 class="username-text">Mortal Name</h2>
                    <input type="text" placeholder="Enter Mortal Name...">
                </div>
                <div class="submit-button">
                    <button id="submit-btn" class="submit-btn">Submit</button>
                    <h3 class="submit-text"></h3>
                </div>
                <div class="password">
                    <h2 class="password-text">Death Key</h2>
                    <input type="password" placeholder="Enter Password...">
                </div>
            </div>
        </div>
    </body>
</html>
